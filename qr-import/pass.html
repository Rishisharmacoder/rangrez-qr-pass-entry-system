<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><title>Rangrez 3.0 entry pass</title>
<style>
:root{--ink:#16112A;--text:#F7F2FF;--dim:#A89CC8;--gold:#F5A524}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);color:var(--text);font:16px system-ui,sans-serif;text-align:center;padding:24px}
.brand{color:var(--gold);font-size:30px;font-weight:800}.dim{color:var(--dim);font-size:14px}
h1{font-size:24px;margin:18px 0 14px}
.qr{background:#fff;border-radius:18px;padding:16px;display:inline-block}.qr img,.qr canvas{display:block;max-width:100%;height:auto}
p{max-width:320px;margin:16px auto 0;line-height:1.5}
</style></head><body><main>
<div class="brand">Rangrez 3.0</div><div class="dim">Dandiya Night 2026</div>
<h1 id="who"></h1>
<div class="qr" id="box"><div id="c"></div></div>

<p id="msg">Please show this QR code at the gate. It can be used only once. Please do not share it with anyone.</p>
<p class="dim">Tip: Take a screenshot and increase your screen brightness when showing the QR code.</p>

</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
var p=new URLSearchParams(location.hash.slice(1)),t=p.get('t');
if(!t||t.indexOf('DN26.')!==0){
  document.getElementById('box').hidden=true;
  document.getElementById('msg').textContent='Ye link adhura hai. Volunteer se dobara link maango.';
}else{
  document.getElementById('who').textContent=p.get('n')||'';
  if(typeof QRCode==='undefined'){
    document.getElementById('box').hidden=true;
    document.getElementById('msg').textContent='QR load nahi hua. Internet check karo aur page dobara kholo.';
  }else{
    new QRCode(document.getElementById('c'),{text:t,width:256,height:256,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
  }
}
</script></body></html>
